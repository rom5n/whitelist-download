name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2.1.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for manual release (e.g., v1.5.4)'
        required: true
        default: 'v1.5.4'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: amd64
            binary_name: wl-download-windows.exe
          - os: linux
            runner: ubuntu-22.04
            arch: amd64
            binary_name: wl-download-linux
          - os: darwin
            runner: macos-13
            arch: amd64
            binary_name: wl-download-mac-amd64
          - os: darwin
            runner: macos-latest
            arch: arm64
            binary_name: wl-download-mac-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build Frontend
        working-directory: ./frontend
        env:
          CI: false
        run: |
          yarn install
          yarn build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install Linux Dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev gcc

      - name: Build Backend
        working-directory: ./backend
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          # Disable CGO on Windows, Enable on Mac/Linux
          if [ "${{ matrix.os }}" = "windows" ]; then
            export CGO_ENABLED=0
          else
            export CGO_ENABLED=1
          fi
          # Get version from input (manual) or tag (push)
          RAW_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # Strip 'v' prefix for the binary internal version variable
          VERSION="${RAW_VERSION#v}"
          
          if [ "${{ matrix.os }}" = "windows" ]; then
            go build -tags with_utls -ldflags="-s -w -H=windowsgui -X main.version=${VERSION}" -o "../${{ matrix.binary_name }}" .
          else
            go build -tags with_utls -ldflags="-s -w -X main.version=${VERSION}" -o "../${{ matrix.binary_name }}" .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ./${{ matrix.binary_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: ./artifacts/*
